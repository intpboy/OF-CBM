<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff"/>
    </marker>
    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <!-- Rounded box style -->
    <linearGradient id="grad-input" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
    <linearGradient id="grad-flow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
    <linearGradient id="grad-concept" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="grad-backbone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3E5F5"/>
      <stop offset="100%" stop-color="#E1BEE7"/>
    </linearGradient>
    <linearGradient id="grad-sim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </linearGradient>
    <linearGradient id="grad-probe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EAF6"/>
      <stop offset="100%" stop-color="#C5CAE9"/>
    </linearGradient>
    <linearGradient id="grad-output" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFEBE9"/>
      <stop offset="100%" stop-color="#D7CCC8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="340" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">
    OF-CBM: Optical Flow Concept Bottleneck Model Pipeline
  </text>

  <!-- ====== STAGE BOXES (y center = 140) ====== -->

  <!-- 1. Input Video -->
  <g transform="translate(30, 70)" filter="url(#shadow)">
    <rect width="110" height="80" rx="10" fill="url(#grad-input)" stroke="#66BB6A" stroke-width="1.5"/>
    <!-- Film icon -->
    <rect x="35" y="12" width="40" height="30" rx="3" fill="none" stroke="#388E3C" stroke-width="1.5"/>
    <line x1="42" y1="12" x2="42" y2="42" stroke="#388E3C" stroke-width="1"/>
    <line x1="68" y1="12" x2="68" y2="42" stroke="#388E3C" stroke-width="1"/>
    <text x="55" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">Input</text>
    <text x="55" y="74" text-anchor="middle" font-size="10" fill="#555">Video</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="145" y1="110" x2="170" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. RAFT Optical Flow -->
  <g transform="translate(175, 70)" filter="url(#shadow)">
    <rect width="120" height="80" rx="10" fill="url(#grad-flow)" stroke="#42A5F5" stroke-width="1.5"/>
    <!-- Flow arrows icon -->
    <line x1="35" y1="30" x2="55" y2="15" stroke="#1565C0" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="50" y1="35" x2="70" y2="20" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="65" y1="38" x2="85" y2="25" stroke="#1E88E5" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="60" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">RAFT</text>
    <text x="60" y="74" text-anchor="middle" font-size="10" fill="#555">Optical Flow</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="300" y1="110" x2="325" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. FINCH Clustering -->
  <g transform="translate(330, 70)" filter="url(#shadow)">
    <rect width="130" height="80" rx="10" fill="url(#grad-concept)" stroke="#FFA726" stroke-width="1.5"/>
    <!-- Cluster dots icon -->
    <circle cx="45" cy="22" r="5" fill="#E65100" opacity="0.7"/>
    <circle cx="55" cy="18" r="4" fill="#E65100" opacity="0.5"/>
    <circle cx="38" cy="30" r="4" fill="#E65100" opacity="0.6"/>
    <circle cx="75" cy="25" r="5" fill="#F57C00" opacity="0.7"/>
    <circle cx="85" cy="20" r="4" fill="#F57C00" opacity="0.5"/>
    <circle cx="80" cy="33" r="4" fill="#F57C00" opacity="0.6"/>
    <text x="65" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">FINCH</text>
    <text x="65" y="67" text-anchor="middle" font-size="10" fill="#555">Concept</text>
    <text x="65" y="78" text-anchor="middle" font-size="10" fill="#555">Discovery</text>
  </g>

  <!-- Arrow 3→4 (down then right, concept medoids output) -->
  <line x1="465" y1="110" x2="490" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Backbone Feature Extraction -->
  <g transform="translate(495, 70)" filter="url(#shadow)">
    <rect width="130" height="80" rx="10" fill="url(#grad-backbone)" stroke="#AB47BC" stroke-width="1.5"/>
    <!-- Network layers icon -->
    <rect x="30" y="12" width="70" height="8" rx="3" fill="#7B1FA2" opacity="0.3"/>
    <rect x="35" y="23" width="60" height="8" rx="3" fill="#7B1FA2" opacity="0.5"/>
    <rect x="40" y="34" width="50" height="8" rx="3" fill="#7B1FA2" opacity="0.7"/>
    <text x="65" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#7B1FA2">Backbone</text>
    <text x="65" y="72" text-anchor="middle" font-size="10" fill="#555">Feature Extraction</text>
  </g>

  <!-- Arrow 4→5 -->
  <line x1="630" y1="110" x2="655" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. Concept Similarity Projection -->
  <g transform="translate(660, 70)" filter="url(#shadow)">
    <rect width="130" height="80" rx="10" fill="url(#grad-sim)" stroke="#EC407A" stroke-width="1.5"/>
    <!-- Matrix/similarity icon -->
    <rect x="35" y="10" width="24" height="24" rx="2" fill="none" stroke="#C2185B" stroke-width="1.2"/>
    <rect x="71" y="10" width="24" height="24" rx="2" fill="none" stroke="#C2185B" stroke-width="1.2"/>
    <text x="63" y="25" font-size="14" fill="#C2185B" text-anchor="middle">~</text>
    <rect x="38" y="13" width="6" height="6" fill="#E91E63" opacity="0.6"/>
    <rect x="47" y="19" width="6" height="6" fill="#E91E63" opacity="0.8"/>
    <rect x="74" y="13" width="6" height="6" fill="#E91E63" opacity="0.5"/>
    <rect x="83" y="25" width="6" height="6" fill="#E91E63" opacity="0.7"/>
    <text x="65" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#C2185B">Concept</text>
    <text x="65" y="64" text-anchor="middle" font-size="10" fill="#555">Similarity</text>
    <text x="65" y="75" text-anchor="middle" font-size="10" fill="#555">Projection</text>
  </g>

  <!-- Arrow 5→6 -->
  <line x1="795" y1="110" x2="820" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. GLM-SAGA Sparse Probe -->
  <g transform="translate(825, 70)" filter="url(#shadow)">
    <rect width="120" height="80" rx="10" fill="url(#grad-probe)" stroke="#5C6BC0" stroke-width="1.5"/>
    <!-- Sparse weight icon -->
    <rect x="30" y="11" width="60" height="30" rx="2" fill="none" stroke="#283593" stroke-width="1"/>
    <rect x="33" y="14" width="8" height="3" fill="#3F51B5" opacity="0.9"/>
    <rect x="48" y="20" width="12" height="3" fill="#3F51B5" opacity="0.6"/>
    <rect x="70" y="26" width="6" height="3" fill="#3F51B5" opacity="0.4"/>
    <rect x="36" y="32" width="10" height="3" fill="#3F51B5" opacity="0.7"/>
    <text x="60" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#283593">GLM-SAGA</text>
    <text x="60" y="70" text-anchor="middle" font-size="10" fill="#555">Sparse Probe</text>
  </g>

  <!-- Arrow 6→7 -->
  <line x1="950" y1="110" x2="975" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7. Action Class -->
  <g transform="translate(980, 70)" filter="url(#shadow)">
    <rect width="95" height="80" rx="10" fill="url(#grad-output)" stroke="#8D6E63" stroke-width="1.5"/>
    <!-- Checkmark icon -->
    <circle cx="48" cy="25" r="14" fill="none" stroke="#4E342E" stroke-width="1.5"/>
    <polyline points="40,25 46,31 58,19" fill="none" stroke="#4E342E" stroke-width="2"/>
    <text x="48" y="56" text-anchor="middle" font-size="11" font-weight="bold" fill="#4E342E">Action</text>
    <text x="48" y="68" text-anchor="middle" font-size="10" fill="#555">Class</text>
  </g>

  <!-- ====== BOTTOM: Detail annotations ====== -->

  <!-- Stage labels -->
  <text x="85" y="175" text-anchor="middle" font-size="9" fill="#888">x ∈ ℝ^(T×H×W×3)</text>

  <text x="235" y="175" text-anchor="middle" font-size="9" fill="#888">f ∈ ℝ^(T×H×W×2)</text>

  <text x="395" y="175" text-anchor="middle" font-size="9" fill="#888">K concepts</text>
  <text x="395" y="187" text-anchor="middle" font-size="9" fill="#888">(medoid selection)</text>

  <text x="560" y="175" text-anchor="middle" font-size="9" fill="#888">VideoMAE</text>
  <text x="560" y="187" text-anchor="middle" font-size="9" fill="#888">z ∈ ℝ^d</text>

  <text x="725" y="175" text-anchor="middle" font-size="9" fill="#888">cosine sim.</text>
  <text x="725" y="187" text-anchor="middle" font-size="9" fill="#888">c ∈ ℝ^K</text>

  <text x="885" y="175" text-anchor="middle" font-size="9" fill="#888">sparse W ∈ ℝ^(K×C)</text>
  <text x="885" y="187" text-anchor="middle" font-size="9" fill="#888">interpretable</text>

  <text x="1028" y="175" text-anchor="middle" font-size="9" fill="#888">ŷ ∈ {1,...,C}</text>

  <!-- ====== Interpretability highlight box ====== -->
  <rect x="320" y="210" width="730" height="55" rx="8" fill="none" stroke="#FF7043" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="685" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#E64A19">
    Concept Bottleneck Layer — Interpretable Intermediate Representation
  </text>
  <text x="685" y="250" text-anchor="middle" font-size="10" fill="#777">
    Each concept = motion pattern (optical flow cluster medoid) · Sparse weights → human-readable explanations
  </text>

  <!-- ====== Phase labels at top ====== -->
  <rect x="25" y="46" width="145" height="18" rx="9" fill="#66BB6A" opacity="0.15"/>
  <text x="98" y="58" text-anchor="middle" font-size="9" font-weight="bold" fill="#2E7D32">Preprocessing</text>

  <rect x="170" y="46" width="295" height="18" rx="9" fill="#FFA726" opacity="0.15"/>
  <text x="318" y="58" text-anchor="middle" font-size="9" font-weight="bold" fill="#E65100">Concept Discovery (Offline)</text>

  <rect x="490" y="46" width="310" height="18" rx="9" fill="#EC407A" opacity="0.15"/>
  <text x="645" y="58" text-anchor="middle" font-size="9" font-weight="bold" fill="#C2185B">CBM Training</text>

  <rect x="820" y="46" width="260" height="18" rx="9" fill="#5C6BC0" opacity="0.15"/>
  <text x="950" y="58" text-anchor="middle" font-size="9" font-weight="bold" fill="#283593">Inference</text>

  <!-- Legend note -->
  <text x="550" y="300" text-anchor="middle" font-size="9" fill="#999">
    Fig. 1. Overview of the OF-CBM pipeline for explainable video action recognition.
  </text>
  <text x="550" y="315" text-anchor="middle" font-size="9" fill="#999">
    Motion concepts are discovered via FINCH clustering on optical flows, then used as an interpretable bottleneck for classification.
  </text>

</svg>
